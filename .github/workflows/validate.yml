name: Validate catalog repository

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  repository:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout catalog repository
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Validate repository contract
        shell: bash
        run: |
          set -euo pipefail
          test -s README.md
          test -s LICENSES.md
          test -s NOTICE
          test -s ATTRIBUTION
          test -s docs/WIKIMEDIA-LICENSING.md
          if find . -type f -not -path './.git/*' -print0 | xargs -0 grep -Il $'\t' | grep -q .; then
            echo "Tabulatoren sind in Textdateien nicht zulässig." >&2
            exit 1
          fi
          python3 -m py_compile \
            scripts/validate-release.py \
            scripts/validate-wikipedia-content.py \
            tests/test-wikipedia-license-gate.py
          python3 tests/test-wikipedia-license-gate.py

      - name: Checkout pinned LearnPip contract
        uses: actions/checkout@v4
        with:
          repository: kennfarbe/LearnPip
          ref: 13270a7cae206980560040770cacd62e0252129e
          path: .contract/learnpip
          persist-credentials: false

      - name: Validate catalog package when present
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t packages < <(find catalog -maxdepth 1 -type f -name '*.zip' -print 2>/dev/null | sort)
          if (( ${#packages[@]} == 0 )); then
            echo "Kein Inhaltsreleasepaket vorhanden; Repository- und Lizenzprüfungen erfolgreich."
            exit 0
          fi
          if (( ${#packages[@]} != 1 )); then
            echo "Es ist höchstens ein Releasepaket unter catalog/ zulässig." >&2
            exit 1
          fi
          package="${packages[0]}"
          python3 scripts/validate-release.py "$package"
          python3 scripts/validate-wikipedia-content.py "$package"
          python3 .contract/learnpip/scripts/validate-catalog.py "$package"
