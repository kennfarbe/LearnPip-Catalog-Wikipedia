name: Validate catalog repository

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  repository:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout catalog repository
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Validate repository sources
        shell: bash
        run: |
          set -euo pipefail
          test -s README.md
          test -s LICENSES.md
          test -s NOTICE
          test -s ATTRIBUTION
          test -s docs/WIKIMEDIA-LICENSING.md
          test -s docs/CONTENT-DESIGN.md
          test -s catalog/questions.json
          test -s catalog/review.json
          test -s catalog/LICENSES.md
          test -s catalog/NOTICE

          if find . -type f -not -path './.git/*' -print0 | xargs -0 grep -Il $'\t' | grep -q .; then
            echo "Tabulatoren sind in Textdateien nicht zulässig." >&2
            exit 1
          fi

          if find catalog -maxdepth 1 -type f -name '*.zip' -print | grep -q .; then
            echo "Erzeugte Katalog-ZIPs werden nicht im Repository gespeichert." >&2
            exit 1
          fi

          python3 -m py_compile \
            scripts/build-catalog.py \
            scripts/validate-release.py \
            scripts/validate-wikipedia-content.py \
            scripts/validate-learning-design.py \
            tests/test-wikipedia-license-gate.py \
            tests/test-example-catalog.py

          python3 tests/test-wikipedia-license-gate.py
          python3 tests/test-example-catalog.py

      - name: Checkout pinned LearnPip contract
        uses: actions/checkout@v4
        with:
          repository: kennfarbe/LearnPip
          ref: 13270a7cae206980560040770cacd62e0252129e
          path: .contract/learnpip
          persist-credentials: false

      - name: Build and validate draft catalog
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/build-catalog.py build --catalog-version ci --allow-draft
          package="build/org.learnpip.wikipedia.aha-ci.zip"
          test -f "$package"

          python3 scripts/validate-release.py "$package"
          python3 scripts/validate-wikipedia-content.py "$package"
          python3 scripts/validate-learning-design.py "$package"
          python3 .contract/learnpip/scripts/validate-catalog.py "$package"
